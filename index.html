<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$750 Apple Cash</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f4f4f6;
      --text:#000;
      --muted:#4d5563;
      --box:#ececef;
      --icon:#dedfe3;
      --black:#050505;
    }
    html,body{min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    body{display:flex;justify-content:center;align-items:flex-start}
    .page{width:697px;min-height:803px;background:var(--bg);padding-top:16px}
    .wrap{width:398px;margin:0 auto}
    h1{font-size:30px;line-height:1.1;text-align:center;font-weight:800;letter-spacing:-.8px;margin-bottom:11px}
    .sub{font-size:14px;text-align:center;color:#525a66;margin-bottom:21px;font-weight:400}
    .hero{width:398px;height:223px;display:block;border-radius:15px;margin-bottom:18px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.16))}
    h2{font-size:23px;line-height:1.15;font-weight:800;letter-spacing:-.35px;margin:0 0 12px 1px}
    .steps{display:flex;flex-direction:column;gap:11px;margin-bottom:20px}
    .step{height:73px;background:var(--box);border-radius:14px;display:flex;align-items:center;padding:0 16px;position:relative}
    .icon{width:41px;height:41px;border-radius:9px;background:var(--icon);display:flex;align-items:center;justify-content:center;margin-right:14px;flex:0 0 41px;color:#111}
    .icon svg{width:18px;height:18px;stroke:#111;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .copy{padding-top:1px}
    .title{font-size:14px;font-weight:800;line-height:1.25;margin-bottom:4px}
    .desc{font-size:13px;color:#555d68;line-height:1.25}
    .num{position:absolute;right:16px;top:24px;width:24px;height:24px;border-radius:50%;background:#030303;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
    .btn{height:54px;border-radius:13px;background:var(--black);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:16px;font-weight:400;box-shadow:0 12px 13px rgba(0,0,0,.16)}
    .btn span{margin-left:9px;font-size:20px;line-height:1;position:relative;top:-1px}
    @media(max-width:520px){.page{width:100%;min-height:100vh}.wrap{width:min(398px,calc(100vw - 32px))}.hero{width:100%;height:auto}.step{padding-right:48px}}
  </style>
</head>
