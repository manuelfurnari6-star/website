<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Age Verification</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#050a05;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:24px;
}

.wrapper{
width:100%;
max-width:360px;
text-align:center;
}

.logo{
width:82px;
height:82px;
margin:auto auto 28px;
border-radius:22px;
overflow:hidden;
box-shadow:0 0 25px rgba(44,199,110,.18);
}

.logo img{
width:100%;
height:100%;
display:block;
}

h1{
font-size:36px;
font-weight:900;
margin-bottom:12px;
}

h1 span{
color:#2cc76e;
}

p{
color:#8b9890;
font-size:15px;
line-height:1.5;
margin-bottom:36px;
}

.btn{
display:block;
width:100%;
padding:17px;
border-radius:16px;
font-weight:700;
text-decoration:none;
margin-bottom:12px;
transition:.15s;
}

.yes{
background:#2cc76e;
color:#fff;
}

.yes:hover{
background:#25b060;
}

.no{
border:1px solid #28352b;
color:#8b9890;
}

.no:hover{
background:#101510;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="logo">
<img src="assets/freecash-logo.webp">
</div>

<h1>ARE YOU <span>21+</span>?</h1>

<p>You must be at least 21 years old to continue.</p>

<a class="btn yes" id="yesBtn" href="index.html">
Yes, I am 21 or older
</a>

<a class="btn no" id="noBtn" href="blocked.html">
No, I am under 21
</a>

</div>

<script>
const qs=location.search;
if(qs){
yesBtn.href="index.html"+qs;
noBtn.href="blocked.html"+qs;
}
</script>

</body>
</html>
