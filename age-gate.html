<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kurze Frage</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#090c10;--card1:#15222b;--card2:#121a2e;--border:rgba(255,255,255,.07);--green:#20be5a;--green-hi:#2ee27a;--blue:#235fe7;--text:#e4e7eb;--muted:#808897;--dim:#6b7280}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:44px 44px;
  color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:center;min-height:100vh;
}
.page{width:100%;max-width:440px;padding:40px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logowrap{width:112px;height:112px;border-radius:26px;background:rgba(255,255,255,.04);border:1px solid rgba(32,190,90,.28);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(32,190,90,.30);margin-bottom:26px}
.logowrap img{width:74px;height:74px;border-radius:17px;display:block}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(32,190,90,.08);border:1px solid rgba(32,190,90,.30);font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--green-hi);margin-bottom:22px}
.sub{font-size:16px;color:var(--muted);line-height:1.55;max-width:30ch;margin-bottom:26px}
.card{width:100%;background:linear-gradient(160deg,var(--card1),var(--card2));border:1px solid var(--border);border-radius:22px;padding:30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
h1{font-size:26px;font-weight:900;letter-spacing:-.01em;margin-bottom:22px}
.btn{width:100%;display:block;text-decoration:none;padding:15px 16px;border:none;border-radius:12px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;transition:filter .15s ease,transform .1s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.99)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn.g{background:linear-gradient(180deg,#22c65e,#1eb555);margin-bottom:14px}
.btn.b{background:linear-gradient(180deg,#2a66ee,#1f55d8)}
.foot{margin-top:22px;font-size:12.5px;color:var(--dim);line-height:1.5;max-width:38ch}
</style>
</head>
