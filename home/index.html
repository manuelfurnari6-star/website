<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$750 Apple Cash</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f4f4f6;
      --card-bg:#e9e9eb;
      --text:#000;
      --muted:#505465;
      --radius:14px;
      --w:397px;
    }
    body{
      min-height:100vh;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }
    .page{
      width:100%;
      max-width:625px;
      min-height:803px;
      padding-top:16px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    h1{
      font-size:30px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:-.7px;
      margin-bottom:12px;
      text-align:center;
    }
    .sub{
      font-size:14px;
      color:#555a6c;
      text-align:center;
      margin-bottom:22px;
    }
    .main-card{
      width:var(--w);
      height:222px;
      border-radius:15px;
      overflow:hidden;
      background:#0b0b0c;
      position:relative;
      box-shadow:0 10px 22px rgba(0,0,0,.26);
      margin-bottom:19px;
    }
    .main-card::before{
      content:"";
      position:absolute;inset:0;
      background:
        radial-gradient(ellipse at 25% 70%, rgba(255,86,35,.35), transparent 40%),
        radial-gradient(ellipse at 62% 60%, rgba(39,221,191,.3), transparent 38%),
        radial-gradient(ellipse at 87% 70%, rgba(41,115,255,.32), transparent 35%),
        linear-gradient(135deg,#0e0e0f,#171717 55%,#080808);
    }
    .cash-label,.amount{
      position:absolute;
      top:9px;
      z-index:4;
      color:#fff;
      font-weight:800;
      font-size:27px;
      line-height:1;
      letter-spacing:-.8px;
      text-shadow:0 1px 1px rgba(0,0,0,.4);
    }
    .cash-label{left:10px}.amount{right:12px}
    .dots{position:absolute;inset:0;z-index:2;width:100%;height:100%}
    .section-title{
      width:var(--w);
      font-size:23px;
      font-weight:800;
      letter-spacing:-.35px;
      margin-bottom:12px;
    }
    .steps{
      width:var(--w);
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-bottom:20px;
    }
    .step{
      height:72px;
      border-radius:14px;
      background:#e9e9eb;
      display:grid;
      grid-template-columns:54px 1fr 36px;
      align-items:center;
      padding:0 16px;
    }
    .iconbox{
      width:40px;height:40px;border-radius:9px;background:#dedee0;display:flex;align-items:center;justify-content:center;
    }
    .iconbox svg{width:20px;height:20px;stroke:#111;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .step h3{font-size:14.5px;font-weight:800;margin-bottom:4px;letter-spacing:-.15px}
    .step p{font-size:13px;color:#535765;line-height:1.2}
    .num{width:24px;height:24px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;justify-self:end}
    .cta{
      width:var(--w);
      height:54px;
      border-radius:13px;
      background:#050505;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
      font-size:16px;
      font-weight:500;
      box-shadow:0 10px 18px rgba(0,0,0,.16);
    }
    .cta span{font-size:20px;margin-left:10px;margin-top:-1px}
    @media(max-width:460px){
      :root{--w:min(397px, calc(100vw - 32px));}
      .page{min-height:100vh;padding-top:18px}
      h1{font-size:29px}.sub{font-size:14px}
      .main-card{height:calc(var(--w) * .559)}
      .cash-label,.amount{font-size:26px}
    }
  </style>
</head>
